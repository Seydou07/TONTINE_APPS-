<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venega Logo Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sora', sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      gap: 40px;
    }
    h1 { color: #074B36; font-size: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      max-width: 1200px;
      width: 100%;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    }
    .card h2 { color: #074B36; font-size: 16px; font-weight: 700; }
    .card p { color: #666; font-size: 13px; }
    .dark { background: #1a1a2e; }
    .dark h2, .dark p { color: #ccc; }
    .size-row { display: flex; gap: 20px; align-items: flex-end; }
    img, object { max-width: 100%; }
  </style>
</head>
<body>
  <h1>Venega Logo — Preview</h1>
  
  <div class="grid">
    <!-- Full logo with wordmark -->
    <div class="card">
      <h2>Full Logo (Icon + Wordmark)</h2>
      <object data="venega-logo-full.svg" type="image/svg+xml" width="280"></object>
      <p>venega-logo-full.svg</p>
    </div>

    <!-- Icon only -->
    <div class="card">
      <h2>Icon Only</h2>
      <object data="venega-icon.svg" type="image/svg+xml" width="200"></object>
      <p>venega-icon.svg</p>
    </div>

    <!-- Dark background -->
    <div class="card dark">
      <h2>Icon on Dark Background</h2>
      <object data="venega-icon.svg" type="image/svg+xml" width="200"></object>
      <p>White center on dark bg</p>
    </div>

    <!-- Multiple sizes -->
    <div class="card">
      <h2>Scalability Test</h2>
      <div class="size-row">
        <div style="text-align:center">
          <object data="venega-icon.svg" type="image/svg+xml" width="16"></object>
          <p>16px</p>
        </div>
        <div style="text-align:center">
          <object data="venega-icon.svg" type="image/svg+xml" width="32"></object>
          <p>32px</p>
        </div>
        <div style="text-align:center">
          <object data="venega-icon.svg" type="image/svg+xml" width="64"></object>
          <p>64px</p>
        </div>
        <div style="text-align:center">
          <object data="venega-icon.svg" type="image/svg+xml" width="128"></object>
          <p>128px</p>
        </div>
        <div style="text-align:center">
          <object data="venega-icon.svg" type="image/svg+xml" width="256"></object>
          <p>256px</p>
        </div>
      </div>
    </div>

    <!-- Reference comparison -->
    <div class="card">
      <h2>Reference Image</h2>
      <p>Compare the generated SVG with the original reference</p>
      <div style="display:flex; gap:20px; align-items:center;">
        <div style="text-align:center">
          <object data="venega-icon.svg" type="image/svg+xml" width="150"></object>
          <p>Generated</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
